name: Archive GitHub Clones, Traffic & Adoption Stats

on:
  schedule:
    # Run daily at 06:15 UTC so GitHub's rolling 14-day traffic window is never lost
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: traffic-archive-${{ github.repository }}
  cancel-in-progress: false

jobs:
  archive-traffic:
    name: Snapshot Clones, Views, Referrers & Package Downloads
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository metadata
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch GitHub Traffic, Release & PyPI Adoption Metrics
        id: collect
        env:
          REPO: ${{ github.repository }}
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_PAT }}
          FALLBACK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/traffic_work /tmp/traffic_payload

          # Check if orphan `traffic-stats` branch already exists on origin
          if git ls-remote --exit-code --heads origin traffic-stats >/dev/null 2>&1; then
            git fetch origin traffic-stats:refs/remotes/origin/traffic-stats
            git worktree add /tmp/traffic_work origin/traffic-stats
            (cd /tmp/traffic_work && git checkout -B traffic-stats)
          else
            git worktree add --detach /tmp/traffic_work
            (
              cd /tmp/traffic_work
              git checkout --orphan traffic-stats
              git rm -rf . >/dev/null 2>&1 || true
              git clean -fdx >/dev/null 2>&1 || true
            )
          fi

          python3 - <<'PY'
          import csv
          import datetime
          import json
          import os
          import pathlib
          import urllib.error
          import urllib.request

          repo = os.environ["REPO"]
          traffic_pat = os.environ.get("TRAFFIC_TOKEN", "").strip()
          fallback_tok = os.environ.get("FALLBACK_TOKEN", "").strip()
          active_token = traffic_pat or fallback_tok
          work_dir = pathlib.Path("/tmp/traffic_work")
          work_dir.mkdir(parents=True, exist_ok=True)

          now_utc = datetime.datetime.now(datetime.timezone.utc)
          today_str = now_utc.strftime("%Y-%m-%d")
          iso_now = now_utc.strftime("%Y-%m-%dT%H:%M:%SZ")

          def gh_get(endpoint: str, token: str):
              url = f"https://api.github.com/repos/{repo}{endpoint}"
              headers = {
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "WholeBodyCompute-TrafficArchiver/1.0",
                  "X-GitHub-Api-Version": "2022-11-28",
              }
              if token:
                  headers["Authorization"] = f"Bearer {token}"
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      return resp.status, json.loads(resp.read().decode("utf-8"))
              except urllib.error.HTTPError as e:
                  return e.code, None
              except Exception:
                  return 0, None

          def load_json(path: pathlib.Path, default):
              if path.is_file():
                  try:
                      return json.loads(path.read_text(encoding="utf-8"))
                  except Exception:
                      pass
              return default

          def write_daily_csv(csv_path: pathlib.Path, by_date: dict[str, dict], cols: list[str]) -> None:
              with csv_path.open("w", newline="", encoding="utf-8") as f:
                  writer = csv.DictWriter(f, fieldnames=cols)
                  writer.writeheader()
                  for d_key in sorted(by_date.keys()):
                      writer.writerow({k: by_date[d_key].get(k, 0) for k in cols})

          # 1. Clones & Views (requires TRAFFIC_PAT with repo Administration/Push read access)
          clones_status, clones_raw = gh_get("/traffic/clones", active_token)
          views_status, views_raw = gh_get("/traffic/views", active_token)
          refs_status, refs_raw = gh_get("/traffic/popular/referrers", active_token)
          paths_status, paths_raw = gh_get("/traffic/popular/paths", active_token)

          traffic_authorized = (clones_status == 200 and isinstance(clones_raw, dict))

          clones_hist = load_json(work_dir / "clones_history.json", {"by_date": {}})
          clones_by_date = clones_hist.get("by_date", {})
          if isinstance(clones_raw, dict):
              for item in clones_raw.get("clones", []):
                  day = str(item.get("timestamp", ""))[:10]
                  if day:
                      prev = clones_by_date.get(day, {})
                      clones_by_date[day] = {
                          "date": day,
                          "clones": max(int(prev.get("clones", 0)), int(item.get("count", 0))),
                          "unique_cloners": max(int(prev.get("unique_cloners", 0)), int(item.get("uniques", 0))),
                      }

          total_clones = sum(int(v.get("clones", 0)) for v in clones_by_date.values())
          sum_daily_unique_cloners = sum(int(v.get("unique_cloners", 0)) for v in clones_by_date.values())
          clones_doc = {
              "repository": repo,
              "updated_at": iso_now,
              "total_archived_days": len(clones_by_date),
              "cumulative_clones": total_clones,
              "cumulative_daily_unique_cloners": sum_daily_unique_cloners,
              "by_date": dict(sorted(clones_by_date.items())),
          }
          (work_dir / "clones_history.json").write_text(json.dumps(clones_doc, indent=2) + "\n", encoding="utf-8")
          write_daily_csv(work_dir / "clones_daily.csv", clones_by_date, ["date", "clones", "unique_cloners"])

          views_hist = load_json(work_dir / "views_history.json", {"by_date": {}})
          views_by_date = views_hist.get("by_date", {})
          if isinstance(views_raw, dict):
              for item in views_raw.get("views", []):
                  day = str(item.get("timestamp", ""))[:10]
                  if day:
                      prev = views_by_date.get(day, {})
                      views_by_date[day] = {
                          "date": day,
                          "views": max(int(prev.get("views", 0)), int(item.get("count", 0))),
                          "unique_visitors": max(int(prev.get("unique_visitors", 0)), int(item.get("uniques", 0))),
                      }

          total_views = sum(int(v.get("views", 0)) for v in views_by_date.values())
          sum_daily_unique_visitors = sum(int(v.get("unique_visitors", 0)) for v in views_by_date.values())
          views_doc = {
              "repository": repo,
              "updated_at": iso_now,
              "total_archived_days": len(views_by_date),
              "cumulative_views": total_views,
              "cumulative_daily_unique_visitors": sum_daily_unique_visitors,
              "by_date": dict(sorted(views_by_date.items())),
          }
          (work_dir / "views_history.json").write_text(json.dumps(views_doc, indent=2) + "\n", encoding="utf-8")
          write_daily_csv(work_dir / "views_daily.csv", views_by_date, ["date", "views", "unique_visitors"])

          if isinstance(refs_raw, list):
              (work_dir / "top_referrers_latest.json").write_text(
                  json.dumps({"updated_at": iso_now, "referrers": refs_raw}, indent=2) + "\n",
                  encoding="utf-8",
              )
              ref_jsonl = work_dir / "referrers_snapshots.jsonl"
              existing_lines = ref_jsonl.read_text(encoding="utf-8").splitlines() if ref_jsonl.is_file() else []
              kept = [ln for ln in existing_lines if f'"date": "{today_str}"' not in ln]
              kept.append(json.dumps({"date": today_str, "referrers": refs_raw}))
              ref_jsonl.write_text("\n".join(kept[-365:]) + "\n", encoding="utf-8")

          if isinstance(paths_raw, list):
              (work_dir / "popular_paths_latest.json").write_text(
                  json.dumps({"updated_at": iso_now, "paths": paths_raw}, indent=2) + "\n",
                  encoding="utf-8",
              )

          # 2. Public Repo Metadata, GitHub Release Asset Downloads & PyPI Downloads (works with GITHUB_TOKEN)
          _, repo_info = gh_get("", fallback_tok or active_token)
          _, releases_info = gh_get("/releases?per_page=30", fallback_tok or active_token)

          stars = int((repo_info or {}).get("stargazers_count", 0))
          forks = int((repo_info or {}).get("forks_count", 0))
          watchers = int((repo_info or {}).get("subscribers_count", 0))
          open_issues = int((repo_info or {}).get("open_issues_count", 0))

          gh_release_downloads = 0
          if isinstance(releases_info, list):
              for rel in releases_info:
                  for asset in rel.get("assets", []) if isinstance(rel, dict) else []:
                      gh_release_downloads += int(asset.get("download_count", 0))

          pypi_day = 0
          pypi_week = 0
          pypi_month = 0
          try:
              pypi_req = urllib.request.Request(
                  "https://pypistats.org/api/packages/whole-body-compute/recent",
                  headers={"User-Agent": "WholeBodyCompute-TrafficArchiver/1.0"},
              )
              with urllib.request.urlopen(pypi_req, timeout=10) as pr:
                  pdata = json.loads(pr.read().decode("utf-8")).get("data", {})
                  pypi_day = int(pdata.get("last_day", 0))
                  pypi_week = int(pdata.get("last_week", 0))
                  pypi_month = int(pdata.get("last_month", 0))
          except Exception:
              pass

          adoption_hist = load_json(work_dir / "adoption_snapshots.json", {"by_date": {}})
          ad_by_date = adoption_hist.get("by_date", {})
          ad_by_date[today_str] = {
              "date": today_str,
              "stars": stars,
              "forks": forks,
              "watchers": watchers,
              "open_issues": open_issues,
              "github_release_downloads": gh_release_downloads,
              "pypi_downloads_last_day": pypi_day,
              "pypi_downloads_last_week": pypi_week,
              "pypi_downloads_last_month": pypi_month,
          }
          adoption_hist = {
              "repository": repo,
              "updated_at": iso_now,
              "by_date": dict(sorted(ad_by_date.items())),
          }
          (work_dir / "adoption_snapshots.json").write_text(json.dumps(adoption_hist, indent=2) + "\n", encoding="utf-8")
          write_daily_csv(
              work_dir / "adoption_daily.csv",
              ad_by_date,
              [
                  "date",
                  "stars",
                  "forks",
                  "watchers",
                  "open_issues",
                  "github_release_downloads",
                  "pypi_downloads_last_day",
                  "pypi_downloads_last_week",
                  "pypi_downloads_last_month",
              ],
          )

          # Write human-readable README dashboard on the `traffic-stats` branch
          readme_md = [
              f"# 📊 `{repo}` - Permanent Clone, Traffic & Adoption Archive",
              "",
              f"_Last updated: `{iso_now}` (automated daily snapshot preventing GitHub's 14-day traffic wipe)_",
              "",
              "| Metric | Value | Source |",
              "| :--- | ---: | :--- |",
              f"| **Cumulative GitHub Clones** | **{total_clones:,}** | `clones_daily.csv` ({len(clones_by_date)} days archived) |",
              f"| **Cumulative Daily Unique Cloners** | **{sum_daily_unique_cloners:,}** | `clones_daily.csv` |",
              f"| **Cumulative GitHub Page Views** | **{total_views:,}** | `views_daily.csv` ({len(views_by_date)} days archived) |",
              f"| **Cumulative Daily Unique Visitors** | **{sum_daily_unique_visitors:,}** | `views_daily.csv` |",
              f"| **GitHub Stars / Forks** | **{stars:,} ⭐ / {forks:,} 🍴** | `adoption_daily.csv` |",
              f"| **GitHub Release Asset Downloads** | **{gh_release_downloads:,}** | `adoption_daily.csv` |",
              f"| **PyPI Downloads (Last 30d / 7d)** | **{pypi_month:,} / {pypi_week:,}** | `pypistats.org` |",
              "",
          ]
          if not traffic_authorized:
              readme_md.extend(
                  [
                      "> **Setup Note (`TRAFFIC_PAT`):** GitHub's `/traffic/clones` & `/traffic/views` endpoints require a Fine-Grained PAT",
                      "> with `Administration: Read-only` (or `Contents: Read`) added under **Settings → Secrets and variables → Actions → `TRAFFIC_PAT`**.",
                      "> Stars, forks, release downloads, and PyPI stats are already archiving automatically.",
                      "",
                  ]
              )
          (work_dir / "README.md").write_text("\n".join(readme_md) + "\n", encoding="utf-8")

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              pathlib.Path(summary_path).write_text("\n".join(readme_md) + "\n", encoding="utf-8")
          PY

      - name: Commit & Push Updated Archive to `traffic-stats` Branch
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/traffic_work
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No traffic delta to commit."
          else
            git commit -m "chore(traffic): archive daily clones, views & adoption snapshot ($(date -u +%Y-%m-%d))"
            git push origin HEAD:refs/heads/traffic-stats
          fi
