  hoare_contract_sha256: 6daaed4aa88e269f2cd993872aff7ebfce22ea9c03eb1a545bd6f900343ee03f
  ed25519_signature: XJx76hcu2eO06CGo1pkVb94zCkdk1bs9o/QIhqw/NiipcLDZcjZqPXhlgEmJdDxohqLV757PX9+CBU0DciJJBw==
