  hoare_contract_sha256: c1b6bbf8a2d2269c50f5f69e457864b7bb4a44ea84abb4735b8e8f22427c0b14
  ed25519_signature: hCjAjMHu0S6eceX2M6QOPOAMyAAVUQbHHIYQR2x77vw3OEDeTWL8e1rmC7pta22ifZ0bdCfC2XV/x8/X2YzZBw==
