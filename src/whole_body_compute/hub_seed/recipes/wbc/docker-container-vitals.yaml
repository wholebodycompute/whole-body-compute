schema_version: '1.0'
namespace: wbc
id: docker-container-vitals
name: Docker & Colima Container Memory/OOM Sweep
version: 1.0.0
description: Captures a non-streaming JSON snapshot of running container CPU, RSS
  memory, and PID headroom to prevent silent exit-137 OOM kills.
license: Apache-2.0
author: Whole Body Compute Official Hub
tags:
- docker
- containers
- oom
- vitals
- devops
triggers:
- docker container vitals
- check container memory
- audit docker oom
destructive: false
timeout_total_ms: 30000
app_compatibility:
  platforms:
  - macos
  - linux
  min_wbc_version: 0.1.0
  target_apps: []
  required_clis:
  - docker
parameters:
  output_path:
    type: path
    description: Container telemetry JSONL file
    default: ./docker_vitals.jsonl
    required: false
preconditions:
- getter_type: cli_installed
  target: docker
  description: Docker CLI required
steps:
- name: Snapshot Non-Streaming Container Resource Vitals
  action: run_shell
  timeout_ms: 10000
  on_failure: abort
  command: docker stats --no-stream --format '{{json .}}' > ${output_path}
  postconditions:
  - getter_type: file_exists
    target: ${output_path}
    description: Container stats output created
postconditions:
- getter_type: file_exists
  target: ${output_path}
  description: Container vitals snapshot verified
success_summary: Completed Docker & Colima Container Memory/OOM Sweep deterministically
  at $0.00 cloud token cost
error_summary: Docker & Colima Container Memory/OOM Sweep halted safely at {step_name}
tier_summary:
  archetype: infrastructure_vitals
  raw_step_count: 3
  compiled_step_count: 1
  dominant_tier: TIER_0_LOCAL
  tier_breakdown:
    TIER_0_LOCAL: 1
  reliability_score: 0.99
  contracts_attached:
  - docker_vitals_sweep_contract
  fallback_ladder:
  - 'ir_1_docker_stats: TIER_0_LOCAL'
contract_summary:
  contracts:
  - name: docker_vitals_sweep_contract
    preconditions:
    - DOCKER_CLI_INSTALLED
    idempotency_strategy: READ_ONLY_TELEMETRY_SAMPLE
    natural_key_fields:
    - Container
    - ID
    postconditions:
    - VITALS_SNAPSHOT_WRITTEN
  ssa_edges: []
procedural_dna:
  archetype: infrastructure_vitals
  dominant_tier: TIER_0_LOCAL
  ir_signature_hash: a3edcf4f2ece1a49
  estimated_cloud_tokens_saved: 22000
  estimated_usd_saved_per_run: 0.11
  zero_pii_attestation:
    sanitized: true
    contains_credentials: false
    contains_personal_paths: false
    redaction_engine: whole_body_compute.procedural_telemetry
    pii_patterns_checked:
    - credentials
    - personal_paths
    - emails
    - ssn
    - public_ipv4
    - vascular_egress
