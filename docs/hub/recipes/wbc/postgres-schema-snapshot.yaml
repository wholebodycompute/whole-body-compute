schema_version: '1.0'
namespace: wbc
id: postgres-schema-snapshot
name: Zero-Mutation Postgres DDL & Index Drift Snapshot
version: 1.0.0
description: Captures a read-only `--schema-only` PostgreSQL DDL snapshot (`pg_dump`)
  for migration review without touching row data.
license: Apache-2.0
author: Whole Body Compute Official Hub
tags:
- postgres
- database
- sql
- schema
- migrations
triggers:
- postgres schema snapshot
- dump db schema
- audit sql drift
destructive: false
timeout_total_ms: 30000
app_compatibility:
  platforms:
  - macos
  - linux
  min_wbc_version: 0.1.0
  target_apps: []
  required_clis:
  - pg_dump
parameters:
  database_name:
    type: string
    description: Local Postgres database name
    default: postgres
    required: true
  output_path:
    type: path
    description: DDL SQL output path
    default: ./schema_snapshot.sql
    required: false
preconditions:
- getter_type: cli_installed
  target: pg_dump
  description: pg_dump client binary must be installed
steps:
- name: Export Read-Only PostgreSQL DDL Schema
  action: run_shell
  timeout_ms: 15000
  on_failure: abort
  command: pg_dump --schema-only --no-owner --no-privileges ${database_name} > ${output_path}
  postconditions:
  - getter_type: file_nonempty
    target: ${output_path}
    description: DDL SQL file non-empty
postconditions:
- getter_type: file_nonempty
  target: ${output_path}
  description: Schema DDL verified
success_summary: Completed Zero-Mutation Postgres DDL & Index Drift Snapshot deterministically
  at $0.00 cloud token cost
error_summary: Zero-Mutation Postgres DDL & Index Drift Snapshot halted safely at
  {step_name}
tier_summary:
  archetype: database_schema_audit
  raw_step_count: 3
  compiled_step_count: 1
  dominant_tier: TIER_0_LOCAL
  tier_breakdown:
    TIER_0_LOCAL: 1
  reliability_score: 0.99
  contracts_attached:
  - postgres_ddl_readonly_contract
  fallback_ladder:
  - 'ir_1_pg_dump: TIER_0_LOCAL'
contract_summary:
  contracts:
  - name: postgres_ddl_readonly_contract
    preconditions:
    - PG_DUMP_INSTALLED
    - DATABASE_REACHABLE
    idempotency_strategy: READ_ONLY_DDL_EXPORT
    natural_key_fields:
    - database_name
    postconditions:
    - SCHEMA_SQL_NONEMPTY
  ssa_edges: []
procedural_dna:
  archetype: database_schema_audit
  dominant_tier: TIER_0_LOCAL
  ir_signature_hash: d8cce7dba96f44b3
  estimated_cloud_tokens_saved: 31000
  estimated_usd_saved_per_run: 0.155
  zero_pii_attestation:
    sanitized: true
    contains_credentials: false
    contains_personal_paths: false
    redaction_engine: whole_body_compute.procedural_telemetry
    pii_patterns_checked:
    - credentials
    - personal_paths
    - emails
    - ssn
    - public_ipv4
    - vascular_egress
signature:
  algorithm: ed25519+sha256
  key_id: wbc-hub-official-2026-ed25519
  public_key: BjQUeE3tG5i4omCmTBzjPeFfAFTRwbHxOgveAy1QWxA=
  canonical_payload_sha256: ec61f6b71d4a553b453a5792c1ea9a84c6edfed1ef97af1e73315502a7b12417
  hoare_contract_sha256: 406bfabd9efc6d6b57fde5fbb5ee9599ff02c587bdeeed02a843457db0f28c3c
  ed25519_signature: +kedFzUR++iZ/ofg8RxPGDgX+4uxMj8/0wNinoszxPyIts7A4de8Bvw8sq98ljou8u0+rgQ7EdPKsFoT/H8kAQ==
  signed_at: '2026-11-10T18:00:00Z'
