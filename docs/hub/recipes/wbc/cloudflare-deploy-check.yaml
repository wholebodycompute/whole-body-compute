  hoare_contract_sha256: f806690603d180f14b6446884218b15e6d0b228908556d65ff38865ad771d6a7
  ed25519_signature: wIe9jhzxQAXUI3o9pbbo/2TYbLWOSk/hfCBusNXIl6DhWbdP83aMN/3lm2zA2A4ypOVwb/19PAnYm/EoNJWiDQ==
