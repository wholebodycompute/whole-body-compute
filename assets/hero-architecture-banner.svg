  <text x="123" y="47" class="mono" font-size="11" font-weight="700" fill="#FAF8F5" letter-spacing="0.4">WHOLE BODY COMPUTE · $ body</text>

  <text x="348" y="47" class="mono" font-size="11" font-weight="500" fill="#9A968E">5-Organ Physiological Runtime · Apple Silicon &amp; Linux</text>

