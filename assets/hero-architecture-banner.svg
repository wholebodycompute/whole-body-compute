<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" fill="none" role="img" aria-labelledby="wbcHeroTitle wbcHeroDesc">
  <title id="wbcHeroTitle">Whole Body Compute ($ body) - The 5-Organ Physiological Runtime Underneath Every Agent</title>
  <desc id="wbcHeroDesc">Architectural split diagram contrasting a Brain-in-a-Jar default cloud agent burning $0.56/task across 2.1M unfiltered tokens against Whole Body Compute on Apple Silicon slicing AST symbols in 3ms and finishing 3.11x cheaper ($0.14/task) with 100% accuracy.</desc>

  <defs>
    <pattern id="gridWarm" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#E4E0D7" stroke-width="0.9"/>
    </pattern>
    <pattern id="gridObsidian" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#23221F" stroke-width="0.9"/>
    </pattern>
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2A2A" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FF2A2A" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FF2A2A" stop-opacity="0"/>
    </linearGradient>
    <filter id="softShadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#111110" flood-opacity="0.14"/>
    </filter>
    <filter id="redBloom" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#FF2A2A" flood-opacity="0.55"/>
    </filter>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Helvetica, Arial, sans-serif; }
      .serif { font-family: Georgia, "Instrument Serif", "Times New Roman", serif; }
      .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; }
      @keyframes ecgBeat {
        0%, 100% { stroke-opacity: 0.85; stroke-width: 15; }
        45% { stroke-opacity: 1; stroke-width: 18; }
      }
      @keyframes gateLaser {
        0%, 100% { transform: translateY(-22px); opacity: 0.65; }
        50% { transform: translateY(22px); opacity: 1; }
      }
      @keyframes pulseDot {
        0%, 100% { r: 4; opacity: 1; }
        50% { r: 5.5; opacity: 0.55; }
      }
      .ecg-anim { animation: ecgBeat 1.4s infinite ease-in-out; }
      .laser-anim { animation: gateLaser 2.4s infinite ease-in-out; }
      .dot-anim { animation: pulseDot 1.6s infinite ease-in-out; }
    </style>
  </defs>

  <!-- Outer Editorial Frame -->
  <rect x="2" y="2" width="1196" height="416" rx="18" fill="#FAF8F5" stroke="#CECAC0" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="416" rx="18" fill="url(#gridWarm)"/>

  <!-- Blueprint Registration Corners -->
  <path d="M 18 30 L 18 18 L 30 18" stroke="#111110" stroke-width="1.8" opacity="0.45"/>
  <path d="M 1182 30 L 1182 18 L 1170 18" stroke="#111110" stroke-width="1.8" opacity="0.45"/>
  <path d="M 18 390 L 18 402 L 30 402" stroke="#111110" stroke-width="1.8" opacity="0.45"/>
  <path d="M 1182 390 L 1182 402 L 1170 402" stroke="#111110" stroke-width="1.8" opacity="0.45"/>

